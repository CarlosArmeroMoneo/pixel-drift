name: Prepare Google Play bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-play-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: google-play

    steps:
      - name: Check out main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "17"
          overwrite-settings: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: "12266719"
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify build trust roots
        run: |
          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
          echo "a130d75392c7f27987e832a0ffab892d12ecc57ca5a721831f1bb4cd1be1212d  gradle/verification-metadata.xml" | sha256sum --check
          grep --fixed-strings "distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78" gradle/wrapper/gradle-wrapper.properties

      - name: Check public repository hygiene
        run: python3 scripts/check_repository.py

      - name: Build verified unsigned bundle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --dependency-verification=strict --warning-mode all verifyWallpaperSurfaceContract testDebugUnitTest lintDebug lintProfile bundleRelease

      - name: Sign and verify Play upload bundle
        env:
          PIXELDRIFT_UPLOAD_KEYSTORE_B64: ${{ secrets.PIXELDRIFT_UPLOAD_KEYSTORE_B64 }}
          PIXELDRIFT_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PIXELDRIFT_UPLOAD_KEYSTORE_PASSWORD }}
          PIXELDRIFT_UPLOAD_KEY_ALIAS: ${{ secrets.PIXELDRIFT_UPLOAD_KEY_ALIAS }}
          PIXELDRIFT_UPLOAD_KEY_PASSWORD: ${{ secrets.PIXELDRIFT_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          for variable in \
            PIXELDRIFT_UPLOAD_KEYSTORE_B64 \
            PIXELDRIFT_UPLOAD_KEYSTORE_PASSWORD \
            PIXELDRIFT_UPLOAD_KEY_ALIAS \
            PIXELDRIFT_UPLOAD_KEY_PASSWORD; do
            test -n "${!variable:-}" || { echo "Missing protected secret: ${variable}" >&2; exit 1; }
          done

          keystore="${RUNNER_TEMP}/pixel-drift-upload.p12"
          trap 'rm -f "${keystore}"' EXIT
          printf '%s' "${PIXELDRIFT_UPLOAD_KEYSTORE_B64}" | base64 --decode > "${keystore}"

          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts)"
          test -n "${version_name}"
          test -n "${version_code}"
          grep --fixed-strings 'applicationId = "com.pixeldrift.wallpaper"' app/build.gradle.kts
          grep --fixed-strings 'targetSdk = 36' app/build.gradle.kts

          mkdir -p play-output
          unsigned="app/build/outputs/bundle/release/app-release.aab"
          signed="play-output/PixelDrift-${version_name}-${version_code}-play.aab"

          jarsigner \
            -keystore "${keystore}" \
            -storetype PKCS12 \
            -storepass:env PIXELDRIFT_UPLOAD_KEYSTORE_PASSWORD \
            -keypass:env PIXELDRIFT_UPLOAD_KEY_PASSWORD \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -signedjar "${signed}" \
            "${unsigned}" \
            "${PIXELDRIFT_UPLOAD_KEY_ALIAS}"

          jarsigner -verify -verbose -certs "${signed}" \
            | tee play-output/JARSIGNER_VERIFY.txt
          grep --fixed-strings 'jar verified.' play-output/JARSIGNER_VERIFY.txt
          unzip -t "${signed}"

          keytool -exportcert -rfc \
            -keystore "${keystore}" \
            -storetype PKCS12 \
            -storepass:env PIXELDRIFT_UPLOAD_KEYSTORE_PASSWORD \
            -alias "${PIXELDRIFT_UPLOAD_KEY_ALIAS}" \
            -file play-output/upload_certificate.pem

          printf 'applicationId=com.pixeldrift.wallpaper\nversionName=%s\nversionCode=%s\ntargetSdk=36\n' \
            "${version_name}" "${version_code}" > play-output/BUNDLE_METADATA.txt
          cd play-output
          sha256sum "$(basename "${signed}")" > SHA256SUMS

      - name: Upload protected Play bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pixel-drift-google-play-bundle
          if-no-files-found: error
          retention-days: 7
          path: play-output/
