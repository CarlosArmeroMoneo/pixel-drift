name: Signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release

    steps:
      - name: Check out tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"
          overwrite-settings: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          cmdline-tools-version: "12266719"
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify build trust roots
        run: |
          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
          echo "a130d75392c7f27987e832a0ffab892d12ecc57ca5a721831f1bb4cd1be1212d  gradle/verification-metadata.xml" | sha256sum --check
          grep --fixed-strings "distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78" gradle/wrapper/gradle-wrapper.properties

      - name: Check public repository hygiene
        run: python3 scripts/check_repository.py

      - name: Test, lint, and build unsigned release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --dependency-verification=strict --warning-mode all verifyWallpaperSurfaceContract testDebugUnitTest lintDebug lintProfile assembleRelease

      - name: Sign, verify, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PIXELDRIFT_KEYSTORE_B64: ${{ secrets.PIXELDRIFT_KEYSTORE_B64 }}
          PIXELDRIFT_KEYSTORE_PASSWORD: ${{ secrets.PIXELDRIFT_KEYSTORE_PASSWORD }}
          PIXELDRIFT_KEY_ALIAS: ${{ secrets.PIXELDRIFT_KEY_ALIAS }}
          PIXELDRIFT_KEY_PASSWORD: ${{ secrets.PIXELDRIFT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore="${RUNNER_TEMP}/pixel-drift-release.p12"
          trap 'rm -f "${keystore}"' EXIT
          printf '%s' "${PIXELDRIFT_KEYSTORE_B64}" | base64 --decode > "${keystore}"

          mkdir -p release-output
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            release-output/PixelDrift-aligned.apk
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" sign \
            --ks "${keystore}" \
            --ks-key-alias "${PIXELDRIFT_KEY_ALIAS}" \
            --ks-pass env:PIXELDRIFT_KEYSTORE_PASSWORD \
            --key-pass env:PIXELDRIFT_KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out release-output/PixelDrift.apk \
            release-output/PixelDrift-aligned.apk
          rm release-output/PixelDrift-aligned.apk

          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            release-output/PixelDrift.apk \
            > release-output/APK_SIGNATURE.txt
          apkanalyzer manifest debuggable release-output/PixelDrift.apk | grep --fixed-strings --line-regexp false
          version_name="$(apkanalyzer manifest version-name release-output/PixelDrift.apk)"
          test "${GITHUB_REF_NAME}" = "v${version_name}"
          test "$(apkanalyzer manifest application-id release-output/PixelDrift.apk)" = "com.pixeldrift.wallpaper"

          actual_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release-output/APK_SIGNATURE.txt | tr '[:upper:]' '[:lower:]')"
          expected_cert="$(openssl x509 -in security/PixelDrift-release-certificate.pem -outform DER | sha256sum | cut -d ' ' -f 1)"
          test "${actual_cert}" = "${expected_cert}"

          mv release-output/PixelDrift.apk "release-output/PixelDrift-${version_name}.apk"
          cd release-output
          sha256sum "PixelDrift-${version_name}.apk" > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" \
            "PixelDrift-${version_name}.apk" \
            SHA256SUMS \
            APK_SIGNATURE.txt \
            ../security/PixelDrift-release-certificate.pem \
            --verify-tag \
            --title "Pixel Drift ${version_name}" \
            --generate-notes
